# Konfigurasi Prometheus untuk aplikasi UTS (Laravel + Vue).
# Label "service" = nama service di compose.yaml, dipakai anotasi alarm
# supaya penerima tahu persis container mana yang harus diperiksa.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # Backend Laravel: endpoint /metrics (MetricsController).
  - job_name: laravel-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  # Jumlah request yang masuk ke nginx frontend (halaman + /api).
  - job_name: nginx-frontend
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx-exporter

  # CPU dan memori per container.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  # Metrik mesin host.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana

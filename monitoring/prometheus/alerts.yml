groups:
  - name: ketersediaan-layanan
    rules:
      - alert: LayananMati
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Layanan {{ $labels.job }} tidak bisa dijangkau Prometheus"
          description: "Target {{ $labels.instance }} (job {{ $labels.job }}) berstatus DOWN selama lebih dari 1 menit."
          tindakan_pertama: "Jalankan 'docker compose ps -a' untuk melihat container yang mati, lalu 'docker compose logs --tail 50 {{ $labels.job }}' untuk mencari sebabnya. Kalau container berhenti, nyalakan dengan 'docker compose start {{ $labels.job }}'."

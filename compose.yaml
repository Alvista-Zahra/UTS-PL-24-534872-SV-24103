services:
  db:
    image: mysql:8.4
    container_name: uts-db
    environment:
      MYSQL_DATABASE: uts_app
      MYSQL_USER: uts_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diatur di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diatur di file .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: uts-backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?APP_KEY belum diatur di file .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: uts_app
      DB_USERNAME: uts_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diatur di file .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: uts-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data: